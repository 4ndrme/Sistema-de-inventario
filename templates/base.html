<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Inventario{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Flowbite CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-slate-800 border-b border-slate-700 fixed w-full z-50 top-0 start-0">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a href="/" class="flex items-center space-x-3 rtl:space-x-reverse">
                <span class="self-center text-2xl font-bold whitespace-nowrap text-teal-400">SISTEMA DE INVENTARIO</span>
            </a>
            <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
                <button type="button" class="text-white bg-teal-600 hover:bg-teal-700 focus:ring-4 focus:outline-none focus:ring-teal-800 font-medium rounded-lg text-sm px-4 py-2 text-center transition-colors">Nuevo Producto</button>
                <button data-collapse-toggle="navbar-sticky" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-slate-400 rounded-lg md:hidden hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-600" aria-controls="navbar-sticky" aria-expanded="false">
                    <span class="sr-only">Abrir menú principal</span>
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
                    </svg>
                </button>
            </div>
            <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-sticky">
                <ul class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-slate-700 rounded-lg bg-slate-800 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0">
                    <li>
                        <a href="/" class="block py-2 px-3 text-white bg-teal-600 rounded md:bg-transparent md:text-teal-400 md:p-0" aria-current="page">Inicio</a>
                    </li>
                    <li>
                        <a href="{{ url_for('categorias') }}" class="block py-2 px-3 text-slate-300 rounded hover:bg-slate-700 md:hover:bg-transparent md:hover:text-teal-400 md:p-0 transition-colors">Categorías</a>
                    </li>
                    <li>
                        <a href="#" class="block py-2 px-3 text-slate-300 rounded hover:bg-slate-700 md:hover:bg-transparent md:hover:text-teal-400 md:p-0 transition-colors">Reportes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow pt-24 pb-12 px-4 lg:px-8 max-w-screen-xl mx-auto w-full">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-800 rounded-lg shadow m-4 border border-slate-700">
        <div class="w-full mx-auto max-w-screen-xl p-4 md:flex md:items-center md:justify-between">
            <span class="text-sm text-slate-400 sm:text-center">© 2026 <a href="/" class="hover:text-teal-400 transition-colors">Inventario Pro™</a>. Todos los derechos reservados.</span>
            <ul class="flex flex-wrap items-center mt-3 text-sm font-medium text-slate-400 sm:mt-0">
                <li><a href="#" class="hover:text-teal-400 me-4 md:me-6 transition-colors">Acerca de</a></li>
                <li><a href="#" class="hover:text-teal-400 me-4 md:me-6 transition-colors">Soporte</a></li>
                <li><a href="#" class="hover:text-teal-400 transition-colors">Contacto</a></li>
            </ul>
        </div>
    </footer>

    <!-- Flowbite JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</body>
</html>
