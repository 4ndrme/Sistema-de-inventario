{% extends 'base.html' %}

{% block title %}Nuevo Material - WMS{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-slate-800 rounded-lg shadow-md border border-slate-700 p-8 mt-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-100">Registrar Nuevo Material</h2>
        <a href="{{ url_for('inicio') }}" class="text-slate-400 hover:text-white transition-colors">
            Descartar
        </a>
    </div>

    <!-- El formulario envía los datos por POST a la misma ruta -->
    <form action="{{ url_for('nuevo_material') }}" method="POST">
        
        <div class="grid gap-6 mb-6 md:grid-cols-2">
            <div>
                <label for="codigo" class="block mb-2 text-sm font-medium text-slate-300">Código del Lote/Material</label>
                <input type="text" id="codigo" name="codigo" class="bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block w-full p-2.5" placeholder="Ej. MAT-002" required>
            </div>
            <div>
                <label for="tipo" class="block mb-2 text-sm font-medium text-slate-300">Tipo de Inventario</label>
                <select id="tipo" name="tipo" class="bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block w-full p-2.5" required>
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="Físico">Físico (Repuestos, Herramientas)</option>
                    <option value="Perecible">Perecible (Químicos, Orgánicos)</option>
                    <option value="Digital">Digital (Manuales, Licencias)</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <label for="nombre" class="block mb-2 text-sm font-medium text-slate-300">Nombre del Material</label>
                <input type="text" id="nombre" name="nombre" class="bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block w-full p-2.5" placeholder="Ej. Tambor de resina epoxi 50L" required>
            </div>
            <div>
                <label for="stock" class="block mb-2 text-sm font-medium text-slate-300">Stock Inicial (Unidades)</label>
                <input type="number" id="stock" name="stock" min="0" class="bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block w-full p-2.5" value="0" required>
            </div>
            <div>
                <label for="fecha_caducidad" class="block mb-2 text-sm font-medium text-slate-300">Fecha de Caducidad (Si aplica)</label>
                <input type="date" id="fecha_caducidad" name="fecha_caducidad" class="bg-slate-700 border border-slate-600 text-slate-400 text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block w-full p-2.5">
            </div>
        </div>

        <button type="submit" class="text-white bg-teal-600 hover:bg-teal-700 focus:ring-4 focus:outline-none focus:ring-teal-800 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center transition-colors">Guardar Registro</button>
    </form>
</div>
{% endblock %}
