{% extends 'base.html' %}

{% block title %}Iniciar Sesión - WMS Industrial{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[65vh]">
    <div class="w-full max-w-md bg-slate-800 rounded-lg shadow-md border border-slate-700 p-8">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-teal-400">WMS Industrial</h2>
            <p class="text-sm text-slate-400">Control de Acceso</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-4">
                <label for="username" class="block mb-2 text-sm font-medium text-slate-300">Usuario Operador</label>
                <input type="text" id="username" name="username" class="bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block w-full p-2.5" placeholder="Ej. jperez" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block mb-2 text-sm font-medium text-slate-300">Contraseña</label>
                <input type="password" id="password" name="password" class="bg-slate-700 border border-slate-600 text-slate-100 text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block w-full p-2.5" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="w-full text-white bg-teal-600 hover:bg-teal-700 focus:ring-4 focus:outline-none focus:ring-teal-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors">Ingresar al Sistema</button>

            <div class="mt-4 text-center">
                <p class="text-sm text-slate-400">¿No tienes una cuenta? <a href="{{ url_for('registro') }}" class="text-teal-400 hover:underline transition-colors">Regístrate aquí</a></p>
                <p class="text-xs text-slate-500 mt-2">Uso exclusivo para personal autorizado de la planta.</p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
